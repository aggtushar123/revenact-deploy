# Environment shared by every Django container (web sidecar, worker, jobs).
# Plain values are public configuration; `secret:` entries are Secret Manager
# references resolved by Cloud Run at start-up, never stored here.
plain:
  DEBUG: "False"
  ALLOWED_HOSTS: revenact-web-605430842839.asia-south1.run.app
  CSRF_TRUSTED_ORIGINS: https://revenact-web-605430842839.asia-south1.run.app
  CORS_ALLOWED_ORIGINS: https://revenact-web-605430842839.asia-south1.run.app
  FRONTEND_URL: https://revenact-web-605430842839.asia-south1.run.app
  MAIL_OAUTH_REDIRECT_BASE: https://revenact-web-605430842839.asia-south1.run.app
  # Google front end + nginx sidecar each append to X-Forwarded-For.
  NUM_PROXIES: "2"
  LOG_LEVEL: INFO
  # Valkey's private (PSC) address: terraform output redis_url.
  REDIS_URL: redis://10.10.0.3:6379/0
  GS_BUCKET_NAME: revenact-prod-media
  GOOGLE_CLOUD_PROJECT: revenact-prod
  COPILOT_LLM_PROVIDER: gemini
  # Background work (terraform/scheduler.tf): Cloud Scheduler ticks and the
  # Gmail push, both signed as run-invoker.
  TICK_AUDIENCE: https://revenact-web-605430842839.asia-south1.run.app/api/v1/internal/tick/
  TICK_SERVICE_ACCOUNT: run-invoker@revenact-prod.iam.gserviceaccount.com
  GMAIL_PUBSUB_TOPIC: projects/revenact-prod/topics/gmail-push
  GMAIL_PUBSUB_AUDIENCE: https://revenact-web-605430842839.asia-south1.run.app/api/v1/mail/google/push/
  GMAIL_PUBSUB_SERVICE_ACCOUNT: run-invoker@revenact-prod.iam.gserviceaccount.com
  MAIL_SYNC_ON_PUSH: "True"
  # Push drives Gmail; this is only the backstop.
  MAIL_SYNC_INTERVAL_SECONDS: "1800"
  EMAIL_HOST: smtp.gmail.com
  EMAIL_PORT: "587"
  EMAIL_USE_TLS: "True"
  EMAIL_HOST_USER: ""
  GOOGLE_OAUTH_CLIENT_ID: "595416875092-qaelhjk0ln53pue86kh97qrt3bo29jtu.apps.googleusercontent.com"
  SLACK_OAUTH_CLIENT_ID: ""
  ATLASSIAN_OAUTH_CLIENT_ID: "okXXghnsjvKG1kTHHqPsswX5hfsCHZeU"
secret:
  SECRET_KEY: django-secret-key
  DATABASE_URL: database-url
  MAIL_TOKEN_KEY: mail-token-key
  EMAIL_HOST_PASSWORD: email-host-password
  GOOGLE_OAUTH_CLIENT_SECRET: google-oauth-client-secret
  SLACK_OAUTH_CLIENT_SECRET: slack-oauth-client-secret
  ATLASSIAN_OAUTH_CLIENT_SECRET: atlassian-oauth-client-secret
